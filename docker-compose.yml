############################### DEFINING CUSTOM NETWORK #############################
networks:
  rekroot-network:
    name: rekroot-network
    driver: bridge

############################### DEFINING CUSTOM VOLUMES #############################
volumes:
  rekroot-database-data-volume:
    name: rekroot-database-data-volume
    driver: local
    driver_opts:
      type: none
      o: bind
      device: D:/DOCKER-VOLUMES/rekroot/database-data

############################### DEFINING ALL SERVICES ###############################
services:
  rekroot-mysql-database-service:
    image: mysql:8.0.46
    container_name: rekroot-mysql-instance
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: rekroot
    volumes:
      - rekroot-database-data-volume:/var/lib/mysql
    networks:
      - rekroot-network